name: Diagnose DIKIDI Electron

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch DIKIDI new and old sorting
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $headers = @{"User-Agent"="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36";"Accept-Language"="ru-RU,ru;q=0.9";"X-Requested-With"="XMLHttpRequest"}
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $pageUrl = "https://dikidi.ru/porxaimilaya?p=1.pi-pr&o=8"
          $page = Invoke-WebRequest -Uri $pageUrl -MaximumRedirection 10 -Headers $headers -WebSession $session
          $page.Content | Set-Content -Encoding UTF8 diagnostics/page.html
          foreach ($sort in 'date_desc','date_asc','data_positive','data_negative') {
            $url = "https://dikidi.ru/ru/ajax/profile/reviews/?company=831212&reviews_list_sort_rating=date_desc&reviews_list_employee_id=0&reviews_list_sort=$sort&reviews_list_only_photo=0&is_master=0"
            try {
              $r = Invoke-WebRequest -Uri $url -Headers $headers -WebSession $session -MaximumRedirection 5
              $r.Content | Set-Content -Encoding UTF8 "diagnostics/filter-$sort.json"
            } catch { $_.ErrorDetails.Message | Set-Content -Encoding UTF8 "diagnostics/filter-$sort-error.txt" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dikidi-sort-diagnostics
          path: diagnostics
          if-no-files-found: error
