name: Diagnose DIKIDI Electron

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch DIKIDI employee and master reviews
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $headers = @{"User-Agent"="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36";"Accept-Language"="ru-RU,ru;q=0.9";"X-Requested-With"="XMLHttpRequest"}
          $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          foreach ($url in @(
            "https://dikidi.ru/ru/profile/master/porxaj_milaya_831212/1889650",
            "https://dikidi.ru/porxaimilaya?p=1.pi-pr&o=8"
          )) {
            try {
              $name = if ($url -like '*profile/master*') {'master-page'} else {'company-page'}
              $r = Invoke-WebRequest -Uri $url -Headers $headers -WebSession $session -MaximumRedirection 10
              $r.Content | Set-Content -Encoding UTF8 "diagnostics/$name.html"
            } catch { $_.ErrorDetails.Message | Set-Content -Encoding UTF8 "diagnostics/$name-error.txt" }
          }
          foreach ($sort in 'date_desc','date_asc') {
            foreach ($mode in 'employee','master') {
              $employee = if ($mode -eq 'employee') {'1889650'} else {'0'}
              $isMaster = if ($mode -eq 'master') {1} else {0}
              $filterUrl = "https://dikidi.ru/ru/ajax/profile/reviews/?company=831212&reviews_list_sort_rating=date_desc&reviews_list_employee_id=$employee&reviews_list_sort=$sort&reviews_list_only_photo=0&is_master=$isMaster"
              try {
                $filter = Invoke-WebRequest -Uri $filterUrl -Headers $headers -WebSession $session -MaximumRedirection 5
                $filter.Content | Set-Content -Encoding UTF8 "diagnostics/$mode-filter-$sort.json"
              } catch { $_.ErrorDetails.Message | Set-Content -Encoding UTF8 "diagnostics/$mode-filter-$sort-error.txt" }
              $filtersJson = "{`"reviews_list_sort_rating`":`"date_desc`",`"reviews_list_only_photo`":`"0`",`"reviews_list_sort`":`"$sort`",`"reviews_list_employee_id`":`"$employee`",`"is_master`":$isMaster}"
              $filters = [uri]::EscapeDataString($filtersJson)
              foreach ($offset in 0,5,10,15,20,25,30,35,40,45,50,55) {
                $url = "https://dikidi.ru/ajax/profile/reviews_pagination/?company=831212&offset=$offset&rating=0&filters=$filters"
                try {
                  $r = Invoke-WebRequest -Uri $url -Headers $headers -WebSession $session -MaximumRedirection 5
                  $r.Content | Set-Content -Encoding UTF8 "diagnostics/$mode-$sort-$offset.json"
                } catch { $_.ErrorDetails.Message | Set-Content -Encoding UTF8 "diagnostics/$mode-$sort-$offset-error.txt" }
              }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dikidi-master-diagnostics
          path: diagnostics
          if-no-files-found: error
