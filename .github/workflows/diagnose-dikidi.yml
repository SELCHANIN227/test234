name: Diagnose DIKIDI Electron

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Direct HTTP diagnostic
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          $url = "https://dikidi.ru/porxaimilaya?p=1.pi-pr&o=8"
          try {
            $response = Invoke-WebRequest -Uri $url -MaximumRedirection 10 -Headers @{"User-Agent"="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36";"Accept-Language"="ru-RU,ru;q=0.9"}
            $response.Content | Set-Content -Encoding UTF8 diagnostics/http-page.html
            @{status=[int]$response.StatusCode; finalUrl=$response.BaseResponse.RequestMessage.RequestUri.AbsoluteUri; length=$response.Content.Length; headers=$response.Headers | Out-String} | ConvertTo-Json | Set-Content -Encoding UTF8 diagnostics/http.json
          } catch {
            @{error=$_.Exception.Message; response=$_.ErrorDetails.Message} | ConvertTo-Json | Set-Content -Encoding UTF8 diagnostics/http.json
          }
      - name: Download Electron
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/electron/electron/releases/download/v43.2.0/electron-v43.2.0-win32-x64.zip" -OutFile electron.zip
          Expand-Archive electron.zip -DestinationPath electron
      - name: Create diagnostic app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diag | Out-Null
          '{"name":"diag","version":"1.0.0","main":"main.js"}' | Set-Content -Encoding UTF8 diag/package.json
          @'
          const { app, BrowserWindow, net } = require('electron');
          const fs = require('fs');
          const path = require('path');
          const target = 'https://dikidi.ru/porxaimilaya?p=1.pi-pr&o=8';
          const out = path.join(process.cwd(), 'diagnostics');
          fs.mkdirSync(out, { recursive: true });
          const log = [];
          let win;
          function push(type, data={}) { log.push({ t:new Date().toISOString(), type, ...data }); fs.writeFileSync(path.join(out,'log.json'), JSON.stringify(log,null,2)); }
          app.commandLine.appendSwitch('disable-gpu');
          app.commandLine.appendSwitch('no-sandbox');
          app.whenReady().then(async () => {
            try {
              const response = await net.fetch(target, { headers: { 'user-agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150.0.0.0 Safari/537.36', 'accept-language':'ru-RU,ru;q=0.9' }, redirect:'follow' });
              const body = await response.text();
              fs.writeFileSync(path.join(out,'net-page.html'), body);
              push('net-fetch',{status:response.status,url:response.url,length:body.length,hasReviews:/отзыв|review/i.test(body)});
            } catch(e) { push('net-fetch-error',{message:e.message,stack:e.stack}); }
            win = new BrowserWindow({width:1200,height:900,show:false,webPreferences:{contextIsolation:true,nodeIntegration:false,sandbox:true,javascript:true,images:true}});
            win.on('closed',()=>push('window-closed'));
            win.webContents.on('render-process-gone',(_e,d)=>push('render-process-gone',d));
            win.webContents.on('did-start-loading',()=>push('did-start-loading'));
            win.webContents.on('did-stop-loading',()=>push('did-stop-loading',{url:win?.webContents.getURL()}));
            win.webContents.on('did-finish-load',()=>push('did-finish-load',{url:win?.webContents.getURL(),title:win?.webContents.getTitle()}));
            win.webContents.on('did-fail-load',(_e,code,desc,url,isMain)=>push('did-fail-load',{code,desc,url,isMain}));
            try { await win.loadURL(target); push('loadURL-resolved',{url:win.webContents.getURL()}); } catch(e) { push('loadURL-error',{message:e.message,stack:e.stack}); }
            await new Promise(r=>setTimeout(r,10000));
            if (win && !win.isDestroyed()) {
              try {
                const snap = await win.webContents.executeJavaScript(`({href:location.href,title:document.title,readyState:document.readyState,text:(document.body?.innerText||'').slice(0,20000),textLength:(document.body?.innerText||'').length,htmlLength:(document.documentElement?.outerHTML||'').length,bodyChildren:document.body?.childElementCount||0})`, true);
                fs.writeFileSync(path.join(out,'snapshot.json'),JSON.stringify(snap,null,2)); push('snapshot',snap);
                const img = await win.webContents.capturePage(); fs.writeFileSync(path.join(out,'page.png'),img.toPNG());
              } catch(e) { push('snapshot-error',{message:e.message,stack:e.stack}); }
            }
            app.exit(0);
          });
          setTimeout(()=>{ push('hard-timeout'); app.exit(2); },45000);
          '@ | Set-Content -Encoding UTF8 diag/main.js
      - name: Run diagnostic
        shell: pwsh
        run: |
          & ".\electron\electron.exe" ".\diag"
      - uses: actions/upload-artifact@v4
        with:
          name: dikidi-electron-diagnostics
          path: diagnostics
          if-no-files-found: error
